<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
*,*::after,*::before{padding:0;margin:0;box-sizing:border-box}

:root{
  --dark-color:#0a0010;
  --glow-color:#ff69b4;
}

body{
  display:flex;
  align-items:flex-end;
  justify-content:center;
  min-height:100vh;
  background-color:var(--dark-color);
  overflow:hidden;
}

/* ─── STARS ─── */
.stars{position:fixed;inset:0;pointer-events:none;z-index:0;}
.star{position:absolute;border-radius:50%;background:#fff;animation:twinkle var(--dur,3s) var(--d,0s) ease-in-out infinite alternate;}
@keyframes twinkle{0%{opacity:.15;transform:scale(1)}100%{opacity:.9;transform:scale(1.4)}}

/* ─── SHOOTING STAR ─── */
.shooting-star{
  position:fixed;
  width:2px;height:2px;
  background:#fff;
  border-radius:50%;
  filter:drop-shadow(0 0 6px #fff);
  z-index:1;
  animation:shoot var(--sdur,4s) var(--sdel,0s) linear infinite;
  opacity:0;
}
.shooting-star::before{
  content:'';
  position:absolute;
  top:50%;left:100%;
  width:90px;height:1px;
  background:linear-gradient(to left,rgba(255,255,255,.9),transparent);
  transform:translateY(-50%);
}
@keyframes shoot{
  0%{opacity:0;transform:translate(0,0)}
  2%{opacity:1}
  18%{opacity:1;transform:translate(-38vw,32vh)}
  22%{opacity:0;transform:translate(-42vw,36vh)}
  100%{opacity:0}
}

/* ─── VIGNETTE ─── */
.vignette{
  position:fixed;inset:0;
  pointer-events:none;
  z-index:250;
  background:radial-gradient(ellipse at center,transparent 40%,rgba(5,0,10,.55) 100%);
}

/* ─── MIST ─── */
.mist{
  position:fixed;
  bottom:-4vh;left:-10vw;
  width:120vw;height:22vh;
  z-index:6;
  pointer-events:none;
  background:linear-gradient(to top,rgba(160,60,120,.16),transparent);
  filter:blur(6px);
}
.mist-band{
  position:absolute;
  bottom:0;
  width:60vw;height:100%;
  border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(220,150,200,.12),transparent 70%);
  animation:mistDrift var(--mdur,22s) linear infinite;
}
.mist-band--1{left:-20vw;animation-delay:0s}
.mist-band--2{left:10vw;--mdur:28s;animation-delay:-9s}
.mist-band--3{left:40vw;--mdur:25s;animation-delay:-4s}
@keyframes mistDrift{
  0%{transform:translateX(-8vw)}
  50%{transform:translateX(8vw)}
  100%{transform:translateX(-8vw)}
}

/* ─── FIREFLIES ─── */
.fireflies{position:fixed;inset:0;pointer-events:none;z-index:11;}
.firefly{
  position:absolute;
  width:4px;height:4px;
  border-radius:50%;
  background:#fff2c4;
  box-shadow:0 0 6px 2px rgba(255,230,150,.9),0 0 14px 6px rgba(255,180,220,.4);
  animation:fireflyFloat var(--fdur,9s) var(--fdel,0s) ease-in-out infinite;
  opacity:0;
}
@keyframes fireflyFloat{
  0%{opacity:0;transform:translate(0,0) scale(.6)}
  10%{opacity:1}
  50%{transform:translate(var(--fx,15px),-70px) scale(1)}
  90%{opacity:.9}
  100%{opacity:0;transform:translate(var(--fx2,-10px),-140px) scale(.5)}
}

/* ─── MOON ─── */
.moon{
  position:fixed;top:6vh;right:10vw;width:70px;height:70px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fff9e0,#ffd97a 60%,#c8941e);
  box-shadow:
    0 0 30px 10px rgba(255,220,100,.35),
    0 0 80px 30px rgba(255,200,50,.15),
    0 0 140px 60px rgba(255,190,90,.08);
  animation:moonFloat 8s ease-in-out infinite;
  z-index:1;
}
.moon::before{
  content:'';
  position:absolute;
  inset:-18px;
  border-radius:50%;
  border:1px solid rgba(255,230,170,.12);
  animation:haloSpin 30s linear infinite;
}
@keyframes haloSpin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
.moon::after{
  content:'';position:absolute;top:12px;right:12px;width:15px;height:15px;border-radius:50%;
  background:rgba(180,130,0,.25);
  box-shadow:0 22px 0 10px rgba(160,110,0,.18),18px 30px 0 5px rgba(160,110,0,.12);
}
@keyframes moonFloat{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-12px) rotate(3deg)}}

/* ─── FALLING PETALS ─── */
.petal-fall{
  position:fixed;top:-40px;width:12px;height:16px;border-radius:50% 0 50% 0;opacity:.7;
  animation:petalDrop var(--pt,8s) var(--pd,0s) linear infinite;
  z-index:200;pointer-events:none;
}
@keyframes petalDrop{
  0%{transform:translateY(-40px) rotate(0deg) translateX(0);opacity:.8}
  25%{transform:translateY(25vh) rotate(90deg) translateX(30px);opacity:.6}
  50%{transform:translateY(50vh) rotate(180deg) translateX(-20px);opacity:.5}
  75%{transform:translateY(75vh) rotate(270deg) translateX(20px);opacity:.3}
  100%{transform:translateY(110vh) rotate(360deg) translateX(-10px);opacity:0}
}

/* ─── MESSAGE ─── */
.message-wrap{position:fixed;top:0;left:0;right:0;display:flex;flex-direction:column;align-items:center;padding-top:5vh;z-index:150;pointer-events:none;}
.message-line{
  font-family:'Great Vibes',cursive;color:#fff;letter-spacing:.08em;line-height:1.15;text-align:center;
  animation:msgReveal 3s 1.5s both;
}
.message-line:nth-child(1){
  font-size:clamp(3.5rem,8vw,7rem);
  text-shadow:0 0 30px rgba(255,105,180,.9),0 0 60px rgba(255,105,180,.6),0 0 120px rgba(255,50,130,.4),0 2px 8px rgba(0,0,0,.5);
  animation:msgReveal 3s 1.5s both,shimmer 5s 4.5s ease-in-out infinite;
}
@keyframes shimmer{
  0%,100%{text-shadow:0 0 30px rgba(255,105,180,.9),0 0 60px rgba(255,105,180,.6),0 0 120px rgba(255,50,130,.4),0 2px 8px rgba(0,0,0,.5)}
  50%{text-shadow:0 0 40px rgba(255,150,200,1),0 0 80px rgba(255,120,180,.75),0 0 150px rgba(255,80,150,.5),0 2px 8px rgba(0,0,0,.5)}
}
.message-sub{
  font-family:'Cormorant Garamond',serif;font-size:clamp(.9rem,2vw,1.25rem);font-style:italic;font-weight:300;
  color:rgba(255,200,220,.85);letter-spacing:.35em;margin-top:.5rem;text-shadow:0 0 20px rgba(255,100,180,.5);
  animation:msgReveal 3s 2.4s both;
}
.message-ornament{margin-top:.6rem;display:flex;align-items:center;gap:1rem;animation:msgReveal 3s 3s both;}
.message-ornament span{width:60px;height:1px;background:linear-gradient(to right,transparent,rgba(255,180,210,.6));}
.message-ornament span:last-child{background:linear-gradient(to left,transparent,rgba(255,180,210,.6));}
.message-ornament .heart{font-size:1rem;color:#ff69b4;filter:drop-shadow(0 0 6px rgba(255,105,180,.9));animation:heartbeat 1.2s ease-in-out infinite;}
@keyframes heartbeat{0%,100%{transform:scale(1)}30%{transform:scale(1.25)}60%{transform:scale(1.05)}}
@keyframes msgReveal{0%{opacity:0;transform:translateY(20px)}100%{opacity:1;transform:translateY(0)}}

/* ─── NIGHT BG ─── */
.night{
  position:fixed;left:50%;top:0;transform:translateX(-50%);width:100%;height:100%;filter:blur(.1vmin);
  background-image:
    radial-gradient(ellipse at top,transparent 0%,var(--dark-color)),
    radial-gradient(ellipse at bottom,var(--dark-color),rgba(120,0,60,.25)),
    repeating-linear-gradient(220deg,rgb(0,0,0) 0px,rgb(0,0,0) 19px,transparent 19px,transparent 22px),
    repeating-linear-gradient(189deg,rgb(0,0,0) 0px,rgb(0,0,0) 19px,transparent 19px,transparent 22px),
    repeating-linear-gradient(148deg,rgb(0,0,0) 0px,rgb(0,0,0) 19px,transparent 19px,transparent 22px),
    linear-gradient(90deg,rgb(140,0,100),rgb(60,0,40));
  z-index:0;
}

/* ─── GROUND GLOW ─── */
.ground-glow{
  position:absolute;bottom:-5vmin;left:50%;transform:translateX(-50%);
  width:80vmin;height:15vmin;
  background:radial-gradient(ellipse at center,rgba(200,20,90,.25) 0%,transparent 70%);
  z-index:5;animation:groundPulse 3s ease-in-out infinite;
}
@keyframes groundPulse{0%,100%{opacity:.7;transform:translateX(-50%) scaleX(1)}50%{opacity:1;transform:translateX(-50%) scaleX(1.1)}}

/* ─── FLOWER GARDEN ─── */
.garden{
  position:relative;
  z-index:10;
  display:flex;
  align-items:flex-end;
  gap:3vmin;
  opacity:0;
  animation:gardenIn 1.6s .4s ease-out forwards;
}
@keyframes gardenIn{to{opacity:1}}

.bloom{
  position:relative;
  width:38vmin;
  max-width:340px;
  transform-origin:bottom center;
  animation:sway 6s ease-in-out infinite;
}
.bloom--lily{animation-delay:.3s}
.bloom--rose{animation-delay:0s;transform:scaleX(-1);}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.bloom--rose{animation-name:swayRose}
@keyframes swayRose{0%,100%{transform:scaleX(-1) rotate(-2deg)}50%{transform:scaleX(-1) rotate(2deg)}}

.bloom svg{
  width:100%;height:auto;display:block;
  overflow:visible;
}

.bloom-head{
  transform-origin:170px 190px;
  animation:headBloom 2.2s .9s cubic-bezier(.34,1.4,.64,1) both;
}
.bloom--lily .bloom-head{animation-delay:1.1s}
.bloom--rose .bloom-head{animation-delay:.7s}
@keyframes headBloom{
  0%{transform:scale(0) rotate(-25deg);opacity:0}
  100%{transform:scale(1) rotate(0);opacity:1}
}

.bloom-stem{
  stroke-dasharray:520;
  stroke-dashoffset:520;
  animation:stemGrow 1.6s .1s ease-out forwards;
}
.bloom--rose .bloom-stem{animation-delay:0s}

@keyframes stemGrow{to{stroke-dashoffset:0}}

.bloom-leaf{
  transform-origin:var(--lx,0) var(--ly,0);
  animation:leafGrow 1s var(--ld,.6s) ease-out both;
}
@keyframes leafGrow{0%{transform:scale(0)}100%{transform:scale(1)}}

.glow-dot{
  animation:sparkle var(--gd,3s) var(--gdel,0s) ease-in-out infinite;
}
@keyframes sparkle{
  0%,100%{opacity:.2;r:1.4}
  50%{opacity:1;r:2.4}
}

.not-loaded *{animation-play-state:paused!important}
</style>
</head>

<script>
onload = () => {
  setTimeout(() => document.body.classList.remove("not-loaded"), 1000);
};

const bgm = document.getElementById('bgm');
const tryPlay = () => {
  bgm.play().catch(() => {
    // Autoplay blocked — start on first user interaction instead
    const resume = () => {
      bgm.play();
      document.removeEventListener('click', resume);
      document.removeEventListener('keydown', resume);
      document.removeEventListener('touchstart', resume);
    };
    document.addEventListener('click', resume);
    document.addEventListener('keydown', resume);
    document.addEventListener('touchstart', resume);
  });
};
tryPlay();

const starsEl = document.getElementById('stars');
const starTints=['#ffffff','#ffffff','#ffffff','#ffe9c4','#dbe9ff','#ffd6ec'];
for(let i=0;i<150;i++){
  const s = document.createElement('div');
  s.className='star';
  const sz = Math.random()*2.5+.5;
  const tint = starTints[Math.floor(Math.random()*starTints.length)];
  s.style.cssText=`width:${sz}px;height:${sz}px;top:${Math.random()*85}%;left:${Math.random()*100}%;background:${tint};box-shadow:0 0 ${sz*2}px ${tint};--dur:${(Math.random()*3+2).toFixed(1)}s;--d:${(Math.random()*4).toFixed(1)}s;`;
  starsEl.appendChild(s);
}

const firefliesEl = document.getElementById('fireflies');
for(let i=0;i<22;i++){
  const f = document.createElement('div');
  f.className='firefly';
  f.style.cssText=`
    left:${30+Math.random()*40}%;
    bottom:${2+Math.random()*30}vh;
    --fdur:${(Math.random()*6+7).toFixed(1)}s;
    --fdel:${(Math.random()*8).toFixed(1)}s;
    --fx:${(Math.random()*60-30).toFixed(0)}px;
    --fx2:${(Math.random()*60-30).toFixed(0)}px;
  `;
  firefliesEl.appendChild(f);
}

const petalsEl = document.getElementById('petals');
const petalColors=['#7fb8ff','#1f5fd6','#ff69b4','#ff4499','#ffb3d9','#e0407a'];
for(let i=0;i<18;i++){
  const p = document.createElement('div');
  p.className='petal-fall';
  const c = petalColors[Math.floor(Math.random()*petalColors.length)];
  p.style.cssText=`left:${Math.random()*100}vw;background:${c};width:${Math.random()*8+7}px;height:${Math.random()*10+10}px;--pt:${(Math.random()*6+6).toFixed(1)}s;--pd:${(Math.random()*8).toFixed(1)}s;border-radius:${Math.random()>.5?'50% 0 50% 0':'0 50% 0 50%'};opacity:${(.4+Math.random()*.5).toFixed(2)};box-shadow:0 0 4px ${c}88;`;
  petalsEl.appendChild(p);
}
</script>
</body>
</html>
